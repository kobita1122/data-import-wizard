<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Import Wizard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Data Import Wizard</h1>

<div class="step" id="step1">
  <h3>Step 1: Upload File</h3>
  <input type="file">
  <button onclick="next(2)">Next</button>
</div>

<div class="step" id="step2" style="display:none;">
  <h3>Step 2: Validate Data</h3>
  <p>No errors found</p>
  <button onclick="next(3)">Next</button>
</div>

<div class="step" id="step3" style="display:none;">
  <h3>Step 3: Import</h3>
  <button onclick="finish()">Start Import</button>
  <p id="msg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
